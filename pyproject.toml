[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "assignment-03-mlops"
version = "1.0.0"
description = "Tool-using MLOps agent over DVC, MLflow, Airflow 3 and Kubernetes"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "requests>=2.31",
    "pyyaml>=6.0",
    "jsonschema>=4.21",
    "python-dotenv>=1.0",
    "kubernetes>=29.0",
    "mlflow>=3.0",
    "dvc>=3.50",
    "scikit-learn>=1.4",
    "pandas>=2.1",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "httpx>=0.27", "ruff>=0.5"]
report = ["markdown>=3.5"]

[tool.setuptools]
packages = ["agent", "agent.tools", "api", "training", "inference"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [".venv", ".dvc"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # long lines in tables/format strings are readable here
